name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0)'
        required: true
        default: 'v1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/run_tests.py

      - name: Build Windows Executable (PyInstaller)
        run: |
          pyinstaller Workpulse.spec --clean --noconfirm

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\WorkpulseSetup.iss

      - name: Prepare Windows Distribution Files
        shell: pwsh
        run: |
          mkdir dist\windows_release -Force
          Copy-Item dist\installer\WorkpulseSetup.exe dist\windows_release\WorkpulseSetup.exe
          Copy-Item dist\installer\WorkpulseSetup.exe dist\windows_release\Workpulse-Installer.exe
          Copy-Item dist\installer\WorkpulseSetup.exe dist\windows_release\iHRMSMonitorSetup.exe
          Copy-Item dist\Workpulse\Workpulse.exe dist\windows_release\Workpulse.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/windows_release/*
          retention-days: 5

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt -r requirements-macos.txt

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/run_tests.py

      - name: Configure Apple Developer ID Keychain
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build, Sign, Notarize & Staple Workpulse (macOS)
        env:
          SKIP_TESTS: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" 2>/dev/null || true

      - name: Validate built application bundle & dmg
        run: |
          test -d dist/Workpulse.app
          test -f dist/Workpulse.app/Contents/MacOS/Workpulse
          test -f dist/Workpulse.dmg
          ls -lh dist/Workpulse.dmg

          echo "Mounting and verifying DMG payload..."
          MOUNT_PT=$(mktemp -d /tmp/ci_dmg_mount.XXXXXX)
          hdiutil attach dist/Workpulse.dmg -mountpoint "${MOUNT_PT}" -nobrowse -readonly
          test -d "${MOUNT_PT}/Workpulse.app"
          test -f "${MOUNT_PT}/Workpulse.app/Contents/MacOS/Workpulse"
          MOUNT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${MOUNT_PT}/Workpulse.app/Contents/Info.plist")
          echo "Mounted DMG version: ${MOUNT_VER}"
          test "${MOUNT_VER}" = "2.0.2"
          hdiutil detach "${MOUNT_PT}"
          rm -rf "${MOUNT_PT}"
          echo "DMG payload verification successful."

          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "Validating Developer ID signature & stapling..."
            codesign --verify --deep --strict --verbose=2 dist/Workpulse.app
            spctl --assess --type execute --verbose=4 dist/Workpulse.app || true
            xcrun stapler validate dist/Workpulse.dmg || true
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist/Workpulse.dmg
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release_assets/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: release_assets/macos

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Workpulse ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_assets/windows/WorkpulseSetup.exe
            release_assets/windows/Workpulse.exe
            release_assets/windows/Workpulse-Installer.exe
            release_assets/windows/iHRMSMonitorSetup.exe
            release_assets/macos/Workpulse.dmg
