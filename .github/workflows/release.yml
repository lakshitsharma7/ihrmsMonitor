name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0)'
        required: true
        default: 'v1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Sign Windows Release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows.txt

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/run_tests.py

      - name: Extract Application Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "1.0"
          if (Test-Path "VERSION") {
            $ver = (Get-Content "VERSION").Trim()
          }
          echo "APP_VER=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: "[Step 1/5] Build Application Executable (PyInstaller)"
        run: |
          pyinstaller iHRMS-Desktop.spec --clean --noconfirm

      - name: "[Step 2/5] Sign iHRMS-Desktop Executable with Authenticode"
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 || secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          REQUIRE_SIGNING: "1"
        run: |
          .\scripts\sign_windows.ps1 -Target "dist\iHRMS-Desktop\iHRMS-Desktop.exe" -Description "iHRMS Desktop" -AppUrl "https://indovisionservices.in" -RequireSigning

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: "[Step 3/5] Compile Inno Setup Installer"
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ env.APP_VER }}" iHRMS-Desktop.iss

      - name: "[Step 4/5] Sign Windows Installer"
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 || secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          REQUIRE_SIGNING: "1"
        run: |
          mkdir dist\windows_release -Force
          $ver = "${{ env.APP_VER }}"
          Copy-Item "dist\Windows\iHRMS-Desktop-Setup-$ver.exe" "dist\windows_release\iHRMS-Desktop-Setup-$ver.exe" -Force
          .\scripts\sign_windows.ps1 -Target "dist\windows_release\iHRMS-Desktop-Setup-$ver.exe" -Description "iHRMS Desktop Setup" -AppUrl "https://indovisionservices.in" -RequireSigning

      - name: "[Step 5/5] Verify Windows Signatures (Application & Installer)"
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VER }}"
          .\scripts\verify_windows_signature.ps1 -Target "dist\iHRMS-Desktop\iHRMS-Desktop.exe" "dist\windows_release\iHRMS-Desktop-Setup-$ver.exe" -RequireValid

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/windows_release/*
          retention-days: 5

  build-macos:
    name: Build, Sign & Notarize macOS Release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt -r requirements-macos.txt

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/run_tests.py

      - name: Extract Application Version
        id: get_version
        run: |
          APP_VER="1.0"
          if [ -f "VERSION" ]; then
            APP_VER="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Configure Apple Developer ID Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "No Apple Developer certificate secret found; skipping keychain configuration."
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build, Sign, Notarize & Staple iHRMS Desktop (macOS)
        env:
          SKIP_TESTS: "1"
          REQUIRE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && '1' || '0' }}
          REQUIRE_NOTARIZATION: ${{ (secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_APP_SPECIFIC_PASSWORD != '') && '1' || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" 2>/dev/null || true

      - name: Validate built application bundle & dmg
        run: |
          test -d dist/iHRMS-Desktop.app
          test -f "dist/macOS/iHRMS-Desktop-${{ env.APP_VER }}.dmg"
          ls -lh dist/macOS/

          TARGET_DMG="dist/macOS/iHRMS-Desktop-${{ env.APP_VER }}.dmg"

          echo "Mounting and verifying DMG payload from ${TARGET_DMG}..."
          MOUNT_PT=$(mktemp -d /tmp/ci_dmg_mount.XXXXXX)
          hdiutil attach "${TARGET_DMG}" -mountpoint "${MOUNT_PT}" -nobrowse -readonly
          test -d "${MOUNT_PT}/iHRMS-Desktop.app"
          hdiutil detach "${MOUNT_PT}"
          rm -rf "${MOUNT_PT}"
          echo "DMG payload verification successful."

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Validating Developer ID signature, Hardened Runtime & stapling..."
            codesign --verify --deep --strict --verbose=2 "dist/iHRMS-Desktop.app"
            codesign --verify --verbose=2 "${TARGET_DMG}"
            spctl --assess --type execute --verbose=4 "dist/iHRMS-Desktop.app"
            spctl --assess --type install --verbose=4 "${TARGET_DMG}"
            xcrun stapler validate "${TARGET_DMG}"
          else
            echo "Apple Developer ID signing identity not configured; skipping signature assessment."
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist/macOS/iHRMS-Desktop-*.dmg
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release_assets/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: release_assets/macos

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: iHRMS Desktop ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_assets/windows/iHRMS-Desktop-Setup-*.exe
            release_assets/windows/iHRMS-Desktop-Setup.exe
            release_assets/macos/iHRMS-Desktop-*.dmg
            release_assets/macos/iHRMS-Desktop.dmg
