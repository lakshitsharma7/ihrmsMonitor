name: Build macOS Workpulse

on:
  workflow_dispatch:
  push:
    branches:
      - feature/activity-tracker
      - main
      - master

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt -r requirements-macos.txt

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 scripts/run_tests.py

      - name: Smoke-test macOS Screen Recording permission service
        run: |
          python3 - <<'PYEOF'
          import sys
          assert sys.platform == "darwin", "This step must run on macOS"

          # 1. Verify module loads without errors
          from services.mac_permission_service import (
              has_screen_recording_permission,
              request_screen_recording_permission,
              open_screen_recording_settings,
              can_relaunch,
              reset_relaunch_state,
          )
          print("[OK] mac_permission_service imported successfully")

          # 2. CGPreflightScreenCaptureAccess must not raise
          result = has_screen_recording_permission()
          print(f"[OK] has_screen_recording_permission() -> {result}")
          # In a GitHub Actions runner TCC is not granted, so either True or False is acceptable
          # as long as the function does not raise.

          # 3. Relaunch guard round-trip
          import tempfile, json
          from pathlib import Path
          import services.mac_permission_service as m
          with tempfile.TemporaryDirectory() as td:
              sp = Path(td) / "test_relaunch_state.json"
              m._get_state_path = lambda: sp
              # First call: no state file -> allowed
              ok, reason = can_relaunch()
              assert ok, f"Expected can_relaunch()=True on first call, got: {reason}"
              # Reset clears counter
              reset_relaunch_state()
              data = json.loads(sp.read_text())
              assert data["count"] == 0, f"count != 0 after reset: {data}"
          print("[OK] Relaunch guard state I/O works correctly")

          # 4. NSScreenCaptureUsageDescription present in spec
          spec = Path("Workpulse-macos.spec").read_text()
          assert "NSScreenCaptureUsageDescription" in spec, \
              "NSScreenCaptureUsageDescription missing from Workpulse-macos.spec"
          print("[OK] NSScreenCaptureUsageDescription present in spec")

          print("\n=== macOS Screen Recording permission smoke-test: ALL PASSED ===")
          PYEOF

      - name: Configure Apple Developer ID Keychain
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build, Sign, Notarize & Staple Workpulse (macOS)
        env:
          SKIP_TESTS: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" 2>/dev/null || true

      - name: Validate built application bundle & dmg
        run: |
          echo "Verifying Workpulse.app structure..."
          test -d dist/Workpulse.app
          test -f dist/Workpulse.app/Contents/MacOS/Workpulse
          test -f dist/Workpulse.app/Contents/Info.plist
          
          echo "Inspecting Info.plist..."
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Workpulse.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/Workpulse.app/Contents/Info.plist

          echo "Verifying Workpulse.dmg..."
          test -f dist/macOS/Workpulse.dmg
          ls -lh dist/macOS/Workpulse.dmg

          echo "Mounting and verifying DMG payload..."
          MOUNT_PT=$(mktemp -d /tmp/ci_dmg_mount.XXXXXX)
          hdiutil attach dist/macOS/Workpulse.dmg -mountpoint "${MOUNT_PT}" -nobrowse -readonly
          test -d "${MOUNT_PT}/Workpulse.app"
          test -f "${MOUNT_PT}/Workpulse.app/Contents/MacOS/Workpulse"
          MOUNT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${MOUNT_PT}/Workpulse.app/Contents/Info.plist")
          echo "Mounted DMG version: ${MOUNT_VER}"
          test "${MOUNT_VER}" = "1.0"
          hdiutil detach "${MOUNT_PT}"
          rm -rf "${MOUNT_PT}"
          echo "DMG payload verification successful."

          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "Validating Developer ID signature & stapling..."
            codesign --verify --deep --strict --verbose=2 dist/Workpulse.app
            spctl --assess --type execute --verbose=4 dist/Workpulse.app || true
            xcrun stapler validate dist/macOS/Workpulse.dmg || true
          fi

      - name: Prepare bundle for artifact upload
        run: |
          cd dist
          zip -ry Workpulse.app.zip Workpulse.app

      - name: Upload macOS Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpulse-macos-dist
          path: |
            dist/macOS/Workpulse.dmg
            dist/Workpulse.app.zip
          retention-days: 7
